[project]
name = "meridian-video"
version = "0.1.0"
description = "Production-grade long-form video intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Meridian Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "openai>=1.55.0",
    "anthropic>=0.39.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-pubsub>=2.27.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "opentelemetry-exporter-gcp-monitoring>=1.7.0a0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
meridian = "meridian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["meridian", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["meridian"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
packages = ["meridian"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "google.*",
    "google.genai.*",
    "google.cloud.*",
    "openai.*",
    "anthropic.*",
    "sentence_transformers.*",
    "redis.*",
    "dotenv.*",
    "opentelemetry.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=meridian",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=0",
]

[tool.coverage.run]
source = ["meridian"]
branch = true
omit = ["meridian/cli/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
